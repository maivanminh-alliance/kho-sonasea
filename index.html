<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kho vật tư · Sonasea Premier Nha Trang</title>
<meta name="theme-color" content="#F9F9F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kho Sonasea">
<style>
:root{
  --bg:#F2F2F7;--panel:#FFFFFF;--line:rgba(60,60,67,.20);--line-soft:rgba(60,60,67,.10);
  --ink:#000;--muted:rgba(60,60,67,.60);--muted2:rgba(60,60,67,.30);
  --primary:#007AFF;--primary-dark:#0060DF;--primary-soft:rgba(0,122,255,.12);
  --in:#34C759;--in-ink:#1E8E3E;--in-soft:rgba(52,199,89,.14);
  --out:#FF9500;--out-ink:#B96A00;--out-soft:rgba(255,149,0,.16);
  --tr:#5856D6;--tr-ink:#4240B5;--tr-soft:rgba(88,86,214,.13);
  --ret:#AF52DE;--ret-ink:#8E3CBE;--ret-soft:rgba(175,82,222,.14);
  --bad:#FF3B30;--bad-ink:#C9302C;--bad-soft:rgba(255,59,48,.14);
  --warn:#FF9500;--warn-ink:#9A5B00;--warn-soft:rgba(255,204,0,.22);
  --fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* ---- iOS controls */
.btn{min-height:36px;border:0;border-radius:10px;background:var(--fill);color:var(--primary);padding:0 14px;font-size:15px;font-weight:590;transition:opacity .15s,background .15s;white-space:nowrap}
.btn:hover{background:rgba(118,118,128,.18)}.btn:active{opacity:.55}
.btn.pri{background:var(--primary);color:#fff;font-weight:600;border-radius:11px}.btn.pri:hover{background:var(--primary-dark)}
.btn.in{background:var(--in);color:#fff;border-radius:11px}.btn.out{background:var(--out);color:#fff;border-radius:11px}
.btn.tr{background:var(--tr);color:#fff;border-radius:11px}.btn.ret{background:var(--ret);color:#fff;border-radius:11px}
.btn.in:hover,.btn.out:hover,.btn.tr:hover,.btn.ret:hover{filter:brightness(.94)}
.btn.sm{min-height:30px;padding:0 12px;font-size:13px;border-radius:999px;font-weight:500}
.btn.ghost{background:transparent}
.btn.export{background:#E8F3EC;color:#1D6B3A}.btn.export:hover{background:#D3EADB}
.btn.edit{color:var(--primary);background:var(--primary-soft)}.btn.del{color:var(--bad);background:var(--bad-soft)}
.btn[disabled]{opacity:.4;cursor:default}
input,select,textarea{width:100%;min-height:38px;border:0;border-radius:10px;background:var(--fill2);box-shadow:inset 0 0 0 1px var(--line-soft);padding:9px 12px;outline:none;font-size:15px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--primary)}
input[type=file]{padding:7px;font-size:14px;color:var(--muted)}
input[type=file]::file-selector-button{border:0;border-radius:8px;background:var(--primary-soft);color:var(--primary);padding:6px 12px;font-weight:590;margin-right:10px;font:inherit;cursor:pointer}
textarea{resize:vertical;line-height:1.4}
/* ---- navigation bar */
.app{min-height:100vh}
.hdr{background:rgba(249,249,249,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;position:sticky;top:0;z-index:50;border-bottom:.5px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hdr-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.badge-alliance{background:#000;color:#fff;font-weight:700;font-size:8.5px;padding:4px 7px;border-radius:6px;letter-spacing:.6px;flex-shrink:0}
.hdr h1{font-size:17px;font-weight:640;letter-spacing:-.022em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reload-btn{width:32px;height:32px;min-height:32px;border-radius:999px;border:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;padding:0;background:var(--in);flex-shrink:0}
.reload-btn.busy{background:var(--out);animation:spin .8s linear infinite}.reload-btn.err{background:var(--bad)}.reload-btn.off{background:rgba(60,60,67,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.gear{width:32px;height:32px;min-height:32px;border-radius:999px;border:0;background:var(--fill);color:var(--ink);font-size:16px;padding:0;flex-shrink:0}
.hdr-clock{text-align:right;flex-shrink:0}
.hdr-time{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em}
.hdr-date{color:var(--muted);font-size:11px;margin-top:2px}
.hdr-bottom{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{color:var(--muted);font-size:12px;font-weight:500;background:var(--fill);border-radius:999px;padding:5px 12px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.wait{background:var(--warn-soft);color:var(--warn-ink);cursor:pointer}
/* ---- segmented control */
.segbar{background:rgba(249,249,249,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);display:flex;justify-content:center;padding:8px 12px;position:sticky;top:var(--hdrH,86px);z-index:49}
.nav{display:flex;gap:2px;max-width:1240px;width:100%;background:var(--fill);border-radius:12px;padding:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;height:34px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 13px;font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.nav button:hover{background:rgba(118,118,128,.10)}
.nav button.active{background:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.nav .ico{opacity:.6}.nav button.active .ico{opacity:1;color:var(--primary)}
.nav .cnt{font-size:11px;color:var(--muted);background:var(--fill);border-radius:999px;padding:0 6px;font-weight:600}
/* ---- topbar + content */
main{max-width:1320px;margin:0 auto;padding:0 22px 44px;min-width:0}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:18px 0 14px}
.topbar .title h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.03em}
.topbar .meta{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.top-actions .btn{min-height:38px}
.top-right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card>.hd{min-height:52px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:.5px solid var(--line-soft);flex-wrap:wrap}
.card>.hd h3{margin:0;font-size:17px;font-weight:640;letter-spacing:-.022em}
.card>.hd .meta,.meta{color:var(--muted);font-size:13px}
.card>.bd{padding:14px 18px}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .lb{font-size:12px;font-weight:500;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:680;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted2)}
.kpi.click{cursor:pointer}.kpi.click:active{opacity:.6}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
/* ---- toolbar / table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;border-bottom:.5px solid var(--line-soft)}
.toolbar label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500;flex:0 1 180px}
.toolbar label.q{flex:1 1 260px}
.toolbar .grow{flex:1}
.chips{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:2px;width:max-content;max-width:100%;overflow-x:auto}
.chip{border:0;background:transparent;border-radius:8px;padding:0 13px;height:30px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip.on{background:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.tw{overflow:auto;max-height:calc(100vh - 300px);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 10px;border-bottom:.5px solid var(--line-soft);text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:#F7F7F9;color:var(--muted);font-size:12px;font-weight:500;z-index:2;border-bottom:.5px solid var(--line);white-space:nowrap}
td{font-size:14px}
tbody tr:hover{background:rgba(0,122,255,.05)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--mono);font-size:12.5px;font-weight:590;white-space:nowrap}
tr.click{cursor:pointer}
.neg{color:var(--bad-ink);font-weight:600}
.muted{color:var(--muted)}.small{font-size:12.5px}
.badge{display:inline-flex;align-items:center;min-height:22px;border-radius:999px;padding:0 10px;font-size:12px;font-weight:590;white-space:nowrap}
.b-in,.b-ok{background:var(--in-soft);color:var(--in-ink)}.b-out{background:var(--out-soft);color:var(--out-ink)}
.b-transfer{background:var(--tr-soft);color:var(--tr-ink)}.b-return{background:var(--ret-soft);color:var(--ret-ink)}
.b-bad{background:var(--bad-soft);color:var(--bad-ink)}.b-warn,.b-pend{background:var(--warn-soft);color:var(--warn-ink)}
.b-gray{background:var(--fill);color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--fill);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--in);border-radius:999px}
.bar.low i{background:var(--out)}.bar.bad i{background:var(--bad)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;background:#FBFBFD;border-top:.5px solid var(--line-soft);color:var(--muted);font-size:13px}
/* pivot */
.pv th.d{writing-mode:vertical-rl;transform:rotate(180deg);height:58px;padding:6px 4px;text-align:left}
.pv td.c,.pv th.c{text-align:center;padding:7px 5px;min-width:34px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv td.c.v{background:rgba(0,122,255,.06);font-weight:600}
.pv td.c.neg{color:var(--bad-ink)}
.pv .stk{position:sticky;left:0;background:#fff;z-index:1}.pv th.stk{z-index:3;background:#F7F7F9}
.pv .stk2{position:sticky;left:150px;background:#fff;z-index:1}.pv th.stk2{z-index:3;background:#F7F7F9}
.pv tr.grp td{background:#F7F7F9;font-weight:640;font-size:13px}
.pv tr.tot td{background:#FBFBFD;font-weight:600}
/* chart */
.flow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;padding:12px 0;border-bottom:.5px solid var(--line-soft)}
.flow:last-child{border-bottom:0}
.flow .nm{font-weight:590;padding-top:2px;font-family:var(--mono);font-size:12.5px}
.metric{display:grid;grid-template-columns:44px 1fr 96px;gap:12px;align-items:center;margin:3px 0}
.metric span{font-size:12px;color:var(--muted)}
.metric .t{height:8px;background:var(--fill);border-radius:999px;overflow:hidden}
.metric .t i{display:block;height:100%;border-radius:999px}
.metric b{text-align:right;font-size:13px;font-weight:590;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:8px}
.spark div{flex:1;background:var(--primary);opacity:.75;border-radius:4px 4px 0 0;min-height:2px}
.spark div:hover{opacity:1}
.spark-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.list-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line-soft)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{border-radius:12px;padding:11px 14px;margin:14px 0 0;font-size:13.5px}
.banner.info{background:var(--primary-soft);color:#0B4FA8}
/* ---- sheets */
.drawer{position:fixed;inset:0;z-index:100;display:none}
.drawer.open{display:block}
.drawer .ov{position:fixed;inset:0;background:rgba(0,0,0,.35)}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(590px,100%);background:#fff;display:grid;grid-template-rows:auto minmax(0,1fr)}
.drawer .pn.wide{width:min(980px,100%)}
#dEntry.open{display:flex;align-items:center;justify-content:center;padding:20px}
#dEntry .pn{position:relative;margin:auto;max-height:calc(100vh - 40px);width:min(640px,96vw);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden;bottom:auto}
.drawer .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:52px;border-bottom:.5px solid var(--line-soft);background:rgba(249,249,249,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.drawer .ph h3{margin:0;font-size:17px;font-weight:640;letter-spacing:-.022em;flex:1;text-align:center}
.drawer .ph .btn{background:transparent;color:var(--primary);padding:0 4px;font-weight:400;font-size:17px}
.drawer .ph .sp{width:52px}
.drawer .pb{padding:16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.typebar{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:16px}
.typebar button{flex:1;border:0;background:transparent;border-radius:8px;height:32px;font-weight:500;font-size:13.5px;color:var(--ink)}
.typebar button.on{background:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.typebar button.on[data-t=in]{color:var(--in-ink)}.typebar button.on[data-t=out]{color:var(--out-ink)}
.typebar button.on[data-t=transfer]{color:var(--tr-ink)}.typebar button.on[data-t=return]{color:var(--ret-ink)}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
form.f label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--muted);align-content:start}
form.f .wide{grid-column:1/-1}
form.f button[type=submit]{min-height:50px;border-radius:12px;font-size:17px}
.hint{font-size:12px;font-weight:400;color:var(--muted2)}
.hint.bad{color:var(--bad-ink);font-weight:500}
.combo{position:relative}
.combo .dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:.5px solid var(--line-soft);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:280px;overflow:auto;z-index:20;padding:5px;display:none}
.combo .dd.open{display:block}
.combo .dd div{padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--ink)}
.combo .dd div b{font-family:var(--mono);font-size:12.5px}
.combo .dd div:hover,.combo .dd div.hi{background:var(--primary-soft)}
.combo .dd small{display:block;color:var(--muted);font-size:12px}
.dupbox{grid-column:1/-1;border-radius:12px;padding:11px 13px;font-size:13.5px;display:none}
.dupbox.show{display:block}.dupbox.bad{background:var(--bad-soft);color:#8E1F18}.dupbox.warn{background:var(--warn-soft);color:var(--warn-ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{width:64px;height:64px;border-radius:10px;background-size:cover;background-position:center;position:relative;box-shadow:0 0 0 .5px var(--line-soft)}
.photos .ph b{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer}
/* iOS alert */
.alert-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:300}
.alert{background:rgba(250,250,250,.96);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-radius:14px;padding:20px 18px 0;width:min(88vw,300px);box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center}
.alert .t{font-weight:600;font-size:17px;letter-spacing:-.022em;margin-bottom:6px}
.alert .m{font-size:13px;color:var(--ink);margin-bottom:12px;white-space:pre-line}
.alert input{text-align:center;background:#fff;box-shadow:inset 0 0 0 .5px var(--line);font-size:16px}
.alert .acts{display:grid;grid-template-columns:1fr 1fr;margin:16px -18px 0;border-top:.5px solid var(--line)}
.alert .acts button{border:0;background:transparent;padding:12px;font-size:17px;color:var(--primary);min-height:46px}
.alert .acts button:first-child{border-right:.5px solid var(--line)}
.alert .acts button.b{font-weight:600}.alert .acts button.d{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,10px);background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 20px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:15px;font-weight:500;opacity:0;transition:opacity .22s,transform .22s;z-index:400;max-width:88vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:rgba(201,48,44,.95);border-radius:16px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.cards{display:none}
footer{text-align:center;color:var(--muted2);font-size:12px;border-top:.5px solid var(--line-soft);margin-top:24px;padding:18px 0 4px}
@media (max-width:1180px){.topbar{grid-template-columns:1fr;gap:10px}.top-actions{justify-content:flex-start}.top-right{justify-content:flex-start}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  html,body{overflow-x:hidden}
  input,select,textarea{font-size:16px}
  .hdr{position:static}.segbar{top:0;padding:8px}
  .hdr .sub{font-size:10.5px}
  main{padding:0 12px 60px}
  .topbar{padding:14px 0 10px}
  .topbar .title h2{font-size:26px}
  .top-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .top-actions .btn{min-width:0;padding:0 6px;font-size:14px}
  .top-actions .btn.out{order:5;grid-column:1/-1;min-height:48px;font-size:17px}
  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:24px}
  .toolbar label,.toolbar label.q{flex:1 1 100%}
  .tw.hide-m{display:none}
  .cards{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--bg)}
  .mc{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;display:grid;gap:6px}
  .mc .r1{display:flex;gap:8px;align-items:center}
  .mc .r1 .grow{flex:1;min-width:0}
  .flow{grid-template-columns:1fr;gap:6px}.metric{grid-template-columns:40px 1fr 78px;gap:8px}
  form.f{grid-template-columns:1fr}
  #dEntry.open{display:block;padding:0}
  #dEntry .pn,.drawer .pn{position:fixed;inset:0;width:100%;max-height:none;height:100svh;border-radius:0}
  .drawer .ph{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
}

/* gói thầu */
.pk-b{--pk:#34C759;--pk-ink:#1E8E3E;--pk-soft:rgba(52,199,89,.14)}
.pk-h{--pk:#FF9500;--pk-ink:#B96A00;--pk-soft:rgba(255,149,0,.16)}
.pk-p{--pk:#5856D6;--pk-ink:#4240B5;--pk-soft:rgba(88,86,214,.13)}
.badge.pk-b,.badge.pk-h,.badge.pk-p{background:var(--pk-soft);color:var(--pk-ink)}
.pkgbar{display:flex;align-items:center;gap:10px;padding-top:16px;flex-wrap:wrap}
.pkgbar>span{font-size:13px;color:var(--muted);font-weight:500}
.pkgseg{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:2px}
.pkgseg button{border:0;background:transparent;border-radius:8px;height:30px;padding:0 16px;font-size:13.5px;font-weight:500;color:var(--ink)}
.pkgseg button.on{background:#fff;font-weight:650;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);color:var(--pk-ink,var(--primary))}
.pkgseg button.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pk,var(--primary));margin-right:6px;vertical-align:1px}
.fpkg{display:flex;align-items:center;gap:12px;margin:-4px 0 16px;flex-wrap:wrap}
.fpkg>span{font-size:13px;color:var(--muted);font-weight:500}
.fpkg .pkgseg{flex:1}.fpkg .pkgseg button{flex:1}
.topbar{padding-top:10px}

html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.combo{display:flex;position:relative}
.combo>input{flex:1;border-radius:10px 0 0 10px}
.cbtn{flex:0 0 42px;border:0;border-radius:0 10px 10px 0;background:var(--fill);color:var(--muted);font-size:16px;box-shadow:inset 0 0 0 1px var(--line-soft)}
.cbtn:active{background:var(--primary-soft);color:var(--primary)}
.pblock{display:grid;gap:8px}
.plabel{font-size:13px;font-weight:500;color:var(--muted)}.plabel small{color:var(--muted2)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtns .btn{min-height:46px;border-radius:12px;font-size:15px}
.pbtns .pcam{background:var(--primary);color:#fff}
.photos .ph{width:76px;height:76px}
@media (max-width:700px){
  .hdr{padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
  .hdr-row{margin-bottom:4px}
  .hdr-bottom .pill:first-child{display:none}
  .pill{font-size:11px;padding:3px 10px}
  .nav button{height:36px;padding:0 12px;font-size:13px}
  .pkgbar{padding-top:12px}.pkgbar>span{display:none}
  .pkgbar .pkgseg{flex:1}.pkgbar .pkgseg button{flex:1;padding:0 6px;height:34px}
  .topbar .title h2{font-size:24px}
  form.f{grid-template-columns:1fr 1fr;gap:12px}
  form.f>label:not(.wide){min-width:0}
  #dEntry .pb{padding:12px 14px 0}
  #eSubmit{position:sticky;bottom:0;margin:4px -14px 0;width:calc(100% + 28px);border-radius:0;min-height:56px;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 0 var(--line-soft)}
  .typebar button{height:36px;white-space:nowrap;font-size:12.5px;padding:0 2px}
  .kpi .s{display:none}.kpis{gap:10px}.kpi{padding:12px 14px}
  .fpkg{margin-bottom:12px}.fpkg>span{width:100%}
  .fpkg .pkgseg button{height:36px}
  .combo .dd{max-height:46vh}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 70px)}
}

.login{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.login.open{display:flex}
.lgcard{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:28px 22px 22px;width:min(380px,100%);display:grid;gap:12px;text-align:center}
.lgcard h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em}
.lgcard label{display:grid;gap:6px;text-align:left;font-size:13px;color:var(--muted);font-weight:500}
.lgcard .btn{min-height:50px;font-size:17px;border-radius:12px;margin-top:6px}
.lgerr{color:var(--bad-ink);font-size:13px;min-height:16px}
.acct{background:var(--fill2);border-radius:12px;padding:12px 14px}
.guard{position:fixed;inset:0;z-index:900;background:rgba(242,242,247,.97);display:none;align-items:center;justify-content:center;font-size:17px;font-weight:600;text-align:center;padding:30px}
.guard.on{display:flex}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
</style>
</head>
<body>
<div class="app">
  <header class="hdr" id="hdr">
    <div class="hdr-row">
      <div class="hdr-left">
        <div class="badge-alliance">ALLIANCE</div>
        <div style="min-width:0;overflow:hidden"><h1>Xuất Nhập Kho</h1><div class="sub">Sonasea Premier Nha Trang · QNSV.HĐ.73</div></div>
      </div>
      <button class="reload-btn off" id="btnRefresh" title="Làm mới dữ liệu">↻</button>
      <button class="gear" id="btnSettings" title="Cấu hình kết nối">⚙</button>
      <div class="hdr-clock"><div class="hdr-time" id="hTime">--:--</div><div class="hdr-date" id="hDate">--/--/----</div></div>
    </div>
    <div class="hdr-bottom"><span class="pill">Người lập: Mai Văn Minh</span><span class="pill" id="syncTxt">Đang tải…</span><span class="pill wait" id="outbox" style="display:none"></span><span id="syncDot" style="display:none"></span></div>
  </header>
  <div class="segbar"><nav class="nav" id="nav">
    <button data-v="dash" class="active"><span class="ico">▦</span>Tổng quan</button>
    <button data-v="stock"><span class="ico">▤</span>Tồn kho <span class="cnt" id="cStock"></span></button>
    <button data-v="partner"><span class="ico">☷</span>Nhà thầu</button>
    <button data-v="pivot"><span class="ico">▥</span>Xuất theo ngày</button>
    <button data-v="log" data-t="all"><span class="ico">≡</span>Sổ phiếu <span class="cnt" id="cLog"></span></button>
    <button data-v="log" data-t="in"><span class="ico">↓</span>Nhập kho</button>
    <button data-v="log" data-t="out"><span class="ico">↑</span>Xuất kho</button>
    <button data-v="log" data-t="transfer"><span class="ico">⇆</span>Điều chuyển</button>
    <button data-v="log" data-t="return"><span class="ico">⇄</span>Đổi trả</button>
    <button data-v="audit"><span class="ico">⟲</span>Lịch sử</button>
  </nav></div>
  <main id="main"></main>
</div>


<div class="drawer" id="dEntry"><div class="ov" data-close></div><div class="pn">
  <div class="ph"><button class="btn" data-close type="button">Hủy</button><h3 id="eTitle">Tạo phiếu</h3><span class="sp"></span></div>
  <div class="pb">
    <div class="typebar" id="eType">
      <button type="button" data-t="in">↓ Nhập</button><button type="button" data-t="out">↑ Xuất</button>
      <button type="button" data-t="transfer">⇆ Điều chuyển</button><button type="button" data-t="return">↺ Đổi trả</button>
    </div>
    <div class="fpkg"><span>Gói thầu <b style="color:var(--bad)">*</b></span><div class="pkgseg" id="ePkg"><button type="button" data-p="Bungalow" class="pk-b">Bungalow</button><button type="button" data-p="Hotel" class="pk-h">Hotel</button><button type="button" data-p="Public" class="pk-p">Public</button></div></div>
    <form class="f" id="eForm" autocomplete="off">
      <label class="wide">Vật tư
        <div class="combo"><input id="fMat" placeholder="Gõ mã hoặc tên vật tư…" required><button type="button" class="cbtn" data-dd="fMat" tabindex="-1">▾</button><div class="dd" id="fMatDD"></div></div>
      </label>
      <label class="wide" id="wNewName" style="display:none">Tên vật tư mới<input id="fName"></label>
      <label>Khối lượng<input id="fQty" type="number" min="0" step="any" inputmode="decimal" required></label>
      <label>ĐVT<input id="fUnit" placeholder="thùng / viên / cái…"></label>
      <label>Ngày<input id="fDate" type="date" required></label>
      <label>BB / phiếu số<input id="fDoc"></label>
      <label class="wide" id="wFrom" style="display:none">Từ nhà thầu (bên giao)
        <div class="combo"><input id="fFrom" placeholder="Nhà thầu giao vật tư đi"><button type="button" class="cbtn" data-dd="fFrom" tabindex="-1">▾</button><div class="dd" id="fFromDD"></div></div>
      </label>
      <label class="wide" id="wPartner"><span id="lPartner">Nhà thầu nhận</span>
        <div class="combo"><input id="fPartner" placeholder="Chọn hoặc gõ tên nhà thầu"><button type="button" class="cbtn" data-dd="fPartner" tabindex="-1">▾</button><div class="dd" id="fPartnerDD"></div></div>
      </label>
      <label>Người yêu cầu / nhận<input id="fPerson" list="dlPerson"></label>
      <label>Khu vực / căn<input id="fArea" list="dlArea" placeholder="Bungalow, Hotel, B12…"></label>
      <div class="dupbox" id="dupBox"></div>
      <div class="wide pblock" id="wPhoto"><span class="plabel">Ảnh minh chứng <small>(tối đa 4)</small></span><div class="pbtns"><button type="button" class="btn pcam" id="bCam">📷 Chụp ảnh</button><button type="button" class="btn" id="bLib">🖼 Thư viện</button></div><input id="fCam" type="file" accept="image/*" capture="environment" hidden><input id="fPhoto" type="file" accept="image/*" multiple hidden><div class="photos" id="photoPrev"></div></div>
      <label class="wide">Ghi chú<textarea id="fNote" rows="2"></textarea></label>
      <div class="wide hint" id="stockHint"></div>
      <button class="btn pri wide" type="submit" id="eSubmit">Lưu phiếu</button>
      <datalist id="dlPerson"></datalist><datalist id="dlArea"></datalist>
    </form>
  </div>
</div></div>


<div class="drawer" id="dDetail"><div class="ov" data-close></div><div class="pn wide">
  <div class="ph"><span class="sp"></span><h3 id="dTitle">Chi tiết</h3><button class="btn" data-close type="button">Xong</button></div>
  <div class="pb" id="dBody"></div>
</div></div>


<div class="drawer" id="dSettings"><div class="ov" data-close></div><div class="pn">
  <div class="ph"><span class="sp"></span><h3>Cài đặt</h3><button class="btn" data-close type="button">Xong</button></div>
  <div class="pb">
    <form class="f" id="sForm">
      <label class="wide" id="wUrl">Địa chỉ hệ thống<input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="wide">Tên người dùng máy này<input id="sUser" placeholder="VD: Minh"></label>
      <button class="btn pri wide" type="submit" id="sSave" style="min-height:46px">Lưu</button>
    </form>
  </div>
</div></div>
<div class="guard" id="guard">Vui lòng đóng công cụ nhà phát triển để tiếp tục</div>
<div class="toast" id="toast"></div>
